# PostgreSQL local pour SmartFood Delivery : docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartfood
      POSTGRES_PASSWORD: smartfood
      POSTGRES_DB: smartfood
    ports:
      - "5432:5432"
    volumes:
      - smartfood-pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  smartfood-pg:
